  <path d="M24 8V40" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 11C18 15 20 20 20 24C20 28 18 33 14 37" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M34 11C30 15 28 20 28 24C28 28 30 33 34 37" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Top Apex Star / Speed Notch -->
  <polygon points="24,3 27,10 21,10" fill="#FF5500"/>
</svg>

