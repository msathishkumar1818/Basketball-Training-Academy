<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="vortexGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3700"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0" y1="24" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF5500" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Outer Rim Ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#vortexGrad)" stroke-width="2.5" stroke-dasharray="80 12" stroke-linecap="round"/>
